name: Data Analytics & Reproducibility Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Unit Tests
        run: |
          python -m pytest tests/ -v

      - name: Verify EDA & Feature Engineering Pipeline
        run: |
          python scripts/run_eda.py

      - name: Verify Notebook Execution
        run: |
          pip install jupyter
          jupyter nbconvert --to notebook --execute notebooks/critical_data_analysis.ipynb --output executed_notebook.ipynb
